name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest pyyaml
      - name: Validate manifest, provider, models and tools against the Dify SDK
        run: python -m pytest tests/ -q
      - name: Compile every module
        run: python -m compileall -q provider models tools main.py
