# Limits and capabilities from models.dev models/<provider>/gpt-5.5.toml (2026-09-24).
model: gpt-5.5
label:
  en_US: GPT-5.5
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 1050000
parameter_rules:
  # No temperature/top_p: this model rejects sampling parameters other than the
  # default (upstream metadata says temperature = false, and LiteLLM refuses it).
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 128000
    help:
      en_US: Reasoning models spend part of this budget on hidden reasoning before emitting text. Values under ~128 can return an empty answer.
      zh_Hans: 推理模型会先用掉一部分预算做隐藏推理，设到 128 以下可能返回空内容。
  - name: response_format
    use_template: response_format
